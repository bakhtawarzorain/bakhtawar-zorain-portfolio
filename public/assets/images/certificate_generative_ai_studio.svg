<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%">
  <!-- Background Canvas -->
  <rect width="1200" height="850" fill="#FFFFFF" />

  <!-- Outer Double Line Border -->
  <rect x="32" y="32" width="1136" height="786" fill="none" stroke="#CBD5E1" stroke-width="2" />
  <rect x="42" y="42" width="1116" height="766" fill="#FCFCFA" stroke="#94A3B8" stroke-width="1.2" />

  <!-- Top Left Corner Diagonal Stripes (Google Cloud colors) -->
  <g transform="translate(10, 10)">
    <polygon points="35,0 70,0 0,70 0,35" fill="#4285F4" />
    <polygon points="70,0 105,0 0,105 0,70" fill="#EA4335" />
    <polygon points="105,0 140,0 0,140 0,105" fill="#FBBC05" />
    <polygon points="140,0 175,0 0,175 0,140" fill="#34A853" />
  </g>

  <!-- Bottom Right Corner Diagonal Stripes (Google Cloud colors) -->
  <g transform="translate(1200, 850) rotate(180)">
    <polygon points="35,0 70,0 0,70 0,35" fill="#34A853" />
    <polygon points="70,0 105,0 0,105 0,70" fill="#FBBC05" />
    <polygon points="105,0 140,0 0,140 0,105" fill="#EA4335" />
    <polygon points="140,0 175,0 0,175 0,140" fill="#4285F4" />
  </g>

  <!-- Top-Left: Powered by Google Cloud -->
  <g transform="translate(70, 105)">
    <text x="0" y="5" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="500" fill="#64748B">Powered by</text>
    <text x="0" y="42" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="34" font-weight="700" fill="#4285F4">Google <tspan fill="#5F6368" font-weight="500">Cloud</tspan></text>
  </g>

  <!-- Top-Right: simplilearn | SkillUp Logo -->
  <g transform="translate(760, 115)">
    <text x="0" y="24" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="36" font-weight="700" fill="#F59E0B">simpli<tspan fill="#0284C7">learn</tspan></text>
    <line x1="195" y1="-2" x2="195" y2="32" stroke="#94A3B8" stroke-width="2" />
    <text x="210" y="24" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="36" font-weight="800" fill="#0284C7">Skill<tspan fill="#F59E0B">Up</tspan></text>
  </g>

  <!-- DECLARATION OF COMPLETION Heading (Centered) -->
  <text x="600" y="270" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="30" font-weight="600" fill="#1E3A8A" letter-spacing="4" text-anchor="middle">DECLARATION OF</text>
  <text x="600" y="345" font-family="'Instrument Serif', Georgia, serif" font-size="68" font-weight="400" fill="#1E3A8A" letter-spacing="2" text-anchor="middle">COMPLETION</text>

  <!-- Recipient Name (Centered with dotted underline) -->
  <text x="600" y="445" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="44" font-weight="600" fill="#111827" text-anchor="middle">Bakhtawar Zorain</text>
  <line x1="280" y1="462" x2="920" y2="462" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Course description -->
  <text x="600" y="515" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="20" font-weight="400" fill="#4B5563" text-anchor="middle">has successfully completed the online course:</text>
  <text x="600" y="560" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="29" font-weight="700" fill="#111827" text-anchor="middle">Introduction to Generative AI Studio</text>

  <!-- Commendation note -->
  <text x="600" y="618" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="18" font-weight="400" fill="#4B5563" text-anchor="middle">This professional has demonstrated initiative and a commitment to</text>
  <text x="600" y="648" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="18" font-weight="400" fill="#4B5563" text-anchor="middle">deepening their skills and advancing their career. Well done!</text>

  <!-- Left: Date & Certificate Code -->
  <text x="110" y="728" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="19" font-weight="500" fill="#374151">3rd October 2026</text>
  <text x="110" y="760" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="19" font-weight="500" fill="#374151">Certificate code : <tspan font-weight="600">10827594</tspan></text>

  <!-- Right: Signature Section -->
  <g transform="translate(940, 650)">
    <path d="M 25 45 Q 40 10, 50 35 T 60 55 Q 75 10, 85 40 T 95 60 Q 110 15, 125 45" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 35 25 Q 70 -5, 110 30" fill="none" stroke="#1E293B" stroke-width="2" stroke-linecap="round" />
    <text x="65" y="85" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="18" font-weight="500" fill="#374151" text-anchor="middle">Krishna Kumar</text>
    <text x="65" y="112" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="500" fill="#6B7280" text-anchor="middle">CEO, Simplilearn</text>
  </g>

  <!-- Bottom Disclaimer Note -->
  <text x="600" y="805" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle">This certification is issued solely for the purpose of acknowledging completion of Google Cloud Courses on the Simplilearn portal and is not an official Google Cloud Certification.</text>
